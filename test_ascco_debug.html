<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Debug ASCCO Extraction</title>
</head>
<body>
  <h1>ASCCO Extraction Debug Output</h1>
  <pre id="output">Running...</pre>
  <script src="extractor.js"></script>
  <script>
    async function run() {
      const out = document.getElementById("output");
      try {
        out.textContent = "Fetching https://www.ascco.com/ ...";
        const res = await fetch("https://www.ascco.com/");
        out.textContent = "Fetched! Parsing HTML...";
        const html = await res.text();
        const doc = new DOMParser().parseFromString(html, "text/html");
        out.textContent = "Running Extractor.extractFromDocument...";
        const data = Extractor.extractFromDocument(doc, Extractor.getElementText(doc.body), "https://www.ascco.com/");
        out.textContent = JSON.stringify(data, null, 2);
      } catch (e) {
        out.textContent = "ERROR: " + e.message + "\n" + e.stack;
      }
    }
    run();
  </script>
</body>
</html>
